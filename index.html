<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0f766e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Patient Care" />
<title>Patient Care</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230f766e'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='232' y='120' width='48' height='272' rx='12'/%3E%3Crect x='120' y='232' width='272' height='48' rx='12'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  :root{
    --teal:#0f766e; --teal-d:#0b5952; --teal-l:#14b8a6;
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --blue:#2563eb; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
    --radius:14px; --tap:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  html[dir="rtl"] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
  h1,h2,h3,h4{margin:0 0 .5rem}
  button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:1rem;width:100%;padding:.7rem .8rem;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-l);border-color:var(--teal)}
  label{display:block;font-size:.85rem;color:var(--muted);margin:.6rem 0 .25rem;font-weight:600}
  .hidden{display:none !important}

  /* Header */
  header{position:sticky;top:0;z-index:40;background:var(--teal);color:#fff;
    padding:calc(.6rem + env(safe-area-inset-top)) .8rem .6rem;box-shadow:var(--shadow)}
  .hrow{display:flex;align-items:center;gap:.5rem}
  .brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.4rem;flex:1;min-width:0}
  .brand small{font-weight:500;opacity:.85;font-size:.72rem;display:block}
  .hbtn{background:rgba(255,255,255,.16);border-radius:10px;padding:.45rem .6rem;font-weight:700;
    min-height:40px;display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem}
  .hbtn:active{background:rgba(255,255,255,.3)}
  .nurse-wrap{display:flex;align-items:center;gap:.4rem;margin-top:.55rem;background:rgba(255,255,255,.14);
    border-radius:10px;padding:.25rem .5rem}
  .nurse-wrap span{font-size:1.1rem}
  .nurse-wrap input{background:transparent;border:none;color:#fff;font-weight:700;padding:.35rem .2rem}
  .nurse-wrap input::placeholder{color:rgba(255,255,255,.7)}
  .nurse-wrap input:focus{outline:none}

  /* Tabs */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:var(--card);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(15,23,42,.06)}
  nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem .2rem;
    color:var(--muted);font-size:.68rem;font-weight:600;min-height:60px;justify-content:center}
  nav.tabs button .ic{font-size:1.35rem;line-height:1}
  nav.tabs button.active{color:var(--teal)}
  nav.tabs button.active .ic{transform:translateY(-1px)}

  main{max-width:760px;margin:0 auto;padding:.8rem}
  .view{animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
  .card h2{font-size:1.05rem}
  .card h3{font-size:.95rem}
  .muted{color:var(--muted)}
  .row{display:flex;gap:.6rem;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .btn{background:var(--teal);color:#fff;border-radius:10px;padding:.7rem 1rem;font-weight:700;
    min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;width:100%}
  .btn:active{background:var(--teal-d)}
  .btn.sec{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
  .btn.red{background:var(--red)} .btn.red:active{background:#b91c1c}
  .btn.gray{background:#475569}
  .btn.sm{width:auto;padding:.5rem .8rem;min-height:40px;font-size:.85rem}
  .pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700}
  .pill.green{background:#dcfce7;color:#166534}
  .pill.red{background:#fee2e2;color:#991b1b}
  .pill.amber{background:#fef3c7;color:#92400e}
  .pill.blue{background:#dbeafe;color:#1e40af}
  .pill.gray{background:#f1f5f9;color:#475569}

  /* progress */
  .prog{height:14px;border-radius:999px;background:#e2e8f0;overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
  .prog.food>i{background:linear-gradient(90deg,#f59e0b,#f97316)}
  .prog.water>i{background:linear-gradient(90deg,#38bdf8,#2563eb)}
  .prog-label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;margin-bottom:.25rem}

  /* banners */
  .banner{border-radius:12px;padding:.9rem 1rem;font-weight:800;text-align:center;margin-bottom:.9rem}
  .banner.red{background:var(--red);color:#fff;font-size:1.1rem;letter-spacing:.3px}
  .banner.warn{background:#fef2f2;color:#991b1b;border:2px solid #fecaca;font-size:1rem;line-height:1.35}
  .banner.amber{background:#fffbeb;color:#92400e;border:1px solid #fde68a}

  /* session / step */
  .session{border:1px solid var(--line);border-radius:12px;margin-bottom:.8rem;overflow:hidden;background:#fff}
  .session.active{border-color:var(--teal);box-shadow:0 0 0 2px rgba(15,118,110,.15)}
  .session-head{display:flex;align-items:center;gap:.5rem;padding:.7rem .8rem;background:#f8fafc;cursor:pointer}
  .session-head .num{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
  .session.done .session-head .num{background:var(--green)}
  .session-head .t{font-weight:800}
  .session-head .meta{margin-inline-start:auto;font-size:.75rem}
  .steps{padding:.4rem .8rem .8rem}
  .step{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem 0;border-top:1px dashed var(--line)}
  .step:first-child{border-top:none}
  .step .sic{font-size:1.3rem;line-height:1.2}
  .step .sbody{flex:1;min-width:0}
  .step .stitle{font-weight:700}
  .step .sdesc{font-size:.8rem;color:var(--muted)}
  .step .sstamp{font-size:.72rem;color:var(--green);font-weight:700;margin-top:.15rem}
  .step.locked{opacity:.45}
  .stepbtn{min-height:40px;padding:.4rem .8rem;border-radius:9px;font-weight:800;background:var(--teal);color:#fff;white-space:nowrap}
  .stepbtn:disabled{background:#cbd5e1;color:#fff}
  .stepbtn.done{background:var(--green)}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--teal);font-size:.9rem;margin-top:.25rem}

  /* checklist item */
  .item{display:flex;align-items:flex-start;gap:.6rem;padding:.65rem 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .item .chk{width:26px;height:26px;border:2px solid var(--teal);border-radius:7px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:#fff;cursor:pointer;margin-top:1px}
  .item.done .chk{background:var(--green);border-color:var(--green)}
  .item .ibody{flex:1;min-width:0}
  .item .iname{font-weight:700}
  .item .isub{font-size:.78rem;color:var(--muted)}
  .item .istamp{font-size:.72rem;color:var(--green);font-weight:700}
  .subchk{display:flex;gap:1rem;margin-top:.4rem;flex-wrap:wrap}
  .subchk label{display:inline-flex;align-items:center;gap:.35rem;margin:0;color:var(--ink);font-size:.8rem;cursor:pointer}
  .subchk input{width:20px;height:20px;flex:none}
  .slot-time{display:inline-flex;align-items:center;gap:.4rem;background:var(--teal);color:#fff;
    padding:.2rem .6rem;border-radius:8px;font-weight:800;font-size:.85rem;margin-bottom:.2rem}
  .missed{border-inline-start:3px solid var(--red);padding-inline-start:.6rem}

  /* timeline */
  .tl{position:relative;margin:.5rem 0 0}
  .tl-item{display:flex;gap:.7rem;padding:.5rem 0;border-top:1px solid var(--line)}
  .tl-item:first-child{border-top:none}
  .tl-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:.8rem;width:64px;flex-shrink:0;color:var(--muted)}
  .tl-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .tl-dot.green{background:var(--green)} .tl-dot.red{background:var(--red)} .tl-dot.amber{background:var(--amber)}
  .tl-body{flex:1;min-width:0}
  .tl-body .a{font-weight:700} .tl-body .d{font-size:.78rem;color:var(--muted)}

  .counters{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.4rem 0}
  .counter{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:.5rem;text-align:center}
  .counter .n{font-size:1.4rem;font-weight:900} .counter .l{font-size:.68rem;color:var(--muted);font-weight:700}

  .rem{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-top:1px dashed var(--line)}
  .rem:first-child{border-top:none}
  .rem .ric{font-size:1.3rem} .rem .rt{flex:1;font-weight:700}
  .rem .rc{font-weight:900;color:var(--teal);font-variant-numeric:tabular-nums}
  .rem .rc.soon{color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:start;padding:.5rem .4rem;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}

  /* emergency card */
  .ecard{border:3px solid var(--red);border-radius:14px;overflow:hidden;background:#fff}
  .ecard .ehead{background:var(--red);color:#fff;padding:.7rem 1rem;font-weight:900;font-size:1.1rem;
    display:flex;justify-content:space-between;align-items:center}
  .ecard .ebody{padding:1rem}
  .ecall{background:var(--red);color:#fff;text-align:center;font-weight:900;font-size:1.35rem;
    padding:.9rem;border-radius:10px;margin-top:1rem;letter-spacing:.5px}
  .dx{list-style:none;padding:0;margin:.4rem 0}
  .dx li{padding:.35rem 0;border-bottom:1px dashed var(--line);font-weight:600}
  .dx li::before{content:"⚠️ ";}

  .toast-wrap{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:200;
    display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;padding:0 .8rem}
  .toast{background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:12px;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:100%;animation:pop .25s ease}
  .toast.ok{background:var(--green)} .toast.err{background:var(--red)} .toast.info{background:var(--blue)}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .modal{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.55);display:flex;align-items:center;
    justify-content:center;padding:1rem}
  .modal .box{background:#fff;border-radius:16px;padding:1.2rem;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}

  .kv{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);font-weight:600} .kv .v{font-weight:700;text-align:end}

  pre.sql{background:#0f172a;color:#e2e8f0;padding:.9rem;border-radius:10px;overflow:auto;font-size:.72rem;
    line-height:1.4;max-height:260px}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:.35rem}
  .status-dot.on{background:var(--green)} .status-dot.off{background:var(--amber)}
  details summary{cursor:pointer;font-weight:700;padding:.3rem 0}
  .acc-head{display:flex;align-items:center;gap:.5rem;font-weight:800;margin:.2rem 0 .4rem;font-size:.95rem}

  @media print{
    header,nav.tabs,.toast-wrap,.no-print{display:none !important}
    body{background:#fff;padding:0} main{max-width:100%;padding:0}
    .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
    .print-only{display:block !important}
    #print-scope [data-view]{display:none !important}
  }
  .print-only{display:none}
  .center{text-align:center}
  .sp{height:.5rem}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">
      <span>🩺</span>
      <div style="min-width:0">
        <div data-i18n="appTitle">Patient Care</div>
        <small data-i18n="appSub">NGT Feeding & Medications</small>
      </div>
    </div>
    <button class="hbtn" id="langBtn" title="Language">🌐 <span id="langLabel">AR</span></button>
    <button class="hbtn" id="notifBtn" title="Notifications">🔔</button>
  </div>
  <div class="nurse-wrap">
    <span>👤</span>
    <input id="nurseName" autocomplete="name" data-i18n-ph="nursePh" placeholder="Nurse name…" />
  </div>
</header>

<main id="app">
  <!-- Views injected/toggled by JS -->
  <section class="view" data-view="patient"></section>
  <section class="view hidden" data-view="today"></section>
  <section class="view hidden" data-view="meds"></section>
  <section class="view hidden" data-view="report"></section>
  <section class="view hidden" data-view="admin"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="patient" class="active"><span class="ic">🧑‍⚕️</span><span data-i18n="tabPatient">Patient</span></button>
  <button data-tab="today"><span class="ic">🍼</span><span data-i18n="tabToday">Today</span></button>
  <button data-tab="meds"><span class="ic">💊</span><span data-i18n="tabMeds">Medications</span></button>
  <button data-tab="report"><span class="ic">📋</span><span data-i18n="tabReport">Report</span></button>
  <button data-tab="admin"><span class="ic">🔐</span><span data-i18n="tabAdmin">Admin</span></button>
</nav>

<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   Patient Care PWA — single-file app logic
   Data layer: Supabase (if configured) with localStorage mirror/fallback.
   ========================================================================= */

/* ---------- tiny helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (t, props={}, kids=[]) => {
  const n = document.createElement(t);
  for (const k in props){
    if (k==='class') n.className=props[k];
    else if (k==='html') n.innerHTML=props[k];
    else if (k==='text') n.textContent=props[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if (k==='data') for (const d in props.data) n.dataset[d]=props.data[d];
    else if (props[k]===null || props[k]===false || props[k]===undefined) continue;
    else n.setAttribute(k, props[k]);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c==null)return;
    n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
};
const pad = n => String(n).padStart(2,'0');
const todayISO = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowStamp = () => new Date().toISOString();
const timeHM = (iso) => { const d = iso?new Date(iso):new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseHM = (hm) => { const [h,m]=hm.split(':').map(Number); return {h,m}; };
const uid = () => 'id_' + Math.random().toString(36).slice(2) + Date.now().toString(36);

async function sha256(str){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ // insecure context fallback (non-crypto, still deterministic)
    let h=0; for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i)|0;} return 'w'+(h>>>0).toString(16);
  }
}

/* ---------- toast ---------- */
function toast(msg, kind='ok', ms=2200){
  const t = el('div',{class:'toast '+kind,text:msg});
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(8px)';
    setTimeout(()=>t.remove(),250); }, ms);
}

/* =========================================================================
   STATE + SETTINGS
   ========================================================================= */
const LS = {
  get:(k,d)=>{ try{const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set:(k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} },
};

const DEFAULT_PROFILE = {
  name:'', national_id:'', hc_number:'', dob:'', gender:'', address:'',
  diagnosis_notes:'Tube-fed patient (NGT). T-Tube present. Seizure disorder (on Levetiracetam). '
    +'Diabetic (on Linagliptin). On anticoagulant (Clopidogrel). Sedated at night (Clonazepam).'
};

const settings = {
  feeding_start_time: LS.get('feeding_start_time','06:00'),
  admin_password_hash: LS.get('admin_password_hash',''),
  sb_url: LS.get('sb_url',''),
  sb_key: LS.get('sb_key',''),
};
let profile = LS.get('patient_profile', DEFAULT_PROFILE);
let lang = LS.get('lang','en');
let nurse = LS.get('nurse_name','');

/* Fixed clinical reference dates from the spec */
const FIXED = {
  ngt_change:'2026-08-13',
  ttube_change:'2026-09-08',
  vitd_base:'2026-07-29',   // then every 30 days
};

/* =========================================================================
   i18n
   ========================================================================= */
const I18N = {
  en:{
    appTitle:'Patient Care', appSub:'NGT Feeding & Medications', nursePh:'Nurse name…',
    tabPatient:'Patient', tabToday:'Today', tabMeds:'Medications', tabReport:'Report', tabAdmin:'Admin',
    needNurse:'Enter the nurse name in the header first.',
    saved:'Saved', logged:'Logged', done:'Done',
  },
  ar:{
    appTitle:'رعاية المريض', appSub:'التغذية الأنبوبية والأدوية', nursePh:'اسم الممرض…',
    tabPatient:'المريض', tabToday:'اليوم', tabMeds:'الأدوية', tabReport:'التقرير', tabAdmin:'المشرف',
    needNurse:'أدخل اسم الممرض في الأعلى أولاً.',
    saved:'تم الحفظ', logged:'تم التسجيل', done:'تم',
  }
};
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function applyI18n(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  $('#langLabel').textContent = lang==='ar' ? 'EN' : 'AR';
  $$('[data-i18n]').forEach(n=> n.textContent = t(n.dataset.i18n));
  $$('[data-i18n-ph]').forEach(n=> n.placeholder = t(n.dataset.i18nPh));
}

/* =========================================================================
   DATA LAYER — Supabase w/ localStorage fallback
   Every logging action writes to (a) its specific table and (b) action_log.
   localStorage keys mirror table rows so the app is fully offline-capable.
   ========================================================================= */
const DB = {
  client:null, ready:false,
  async init(){
    this.ready=false; this.client=null;
    if(settings.sb_url && settings.sb_key){
      try{
        if(!window.supabase){ await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'); }
        if(window.supabase){
          this.client = window.supabase.createClient(settings.sb_url, settings.sb_key);
          // light connectivity check
          const { error } = await this.client.from('settings').select('key').limit(1);
          if(!error){ this.ready=true; }
        }
      }catch(e){ console.warn('Supabase init failed, using local:', e); }
    }
    updateSyncBadge();
    return this.ready;
  },
  _lsKey(table){ return 'tbl_'+table; },
  _lsAll(table){ return LS.get(this._lsKey(table), []); },
  _lsPush(table,row){ const a=this._lsAll(table); a.push(row); LS.set(this._lsKey(table),a); },

  async insert(table, row){
    if(!row.id) row.id = uid();
    // local mirror always
    this._lsPush(table,row);
    if(this.ready){
      try{ const {error}=await this.client.from(table).insert(row); if(error) console.warn('insert',table,error.message); }
      catch(e){ console.warn('insert err',e); }
    }
    return row;
  },
  async select(table, {filters={}, gte, lte, col}={}){
    if(this.ready){
      try{
        let q=this.client.from(table).select('*');
        for(const k in filters) q=q.eq(k,filters[k]);
        if(gte&&col) q=q.gte(col,gte);
        if(lte&&col) q=q.lte(col,lte);
        const {data,error}=await q;
        if(!error && data) return data;
      }catch(e){ console.warn('select err',e); }
    }
    // local fallback
    let rows=this._lsAll(table);
    for(const k in filters) rows=rows.filter(r=>String(r[k])===String(filters[k]));
    if(gte&&col) rows=rows.filter(r=>r[col]>=gte);
    if(lte&&col) rows=rows.filter(r=>r[col]<=lte);
    return rows;
  },
  async upsertSetting(key,value){
    settings[key]=value; LS.set(key,value);
    if(this.ready){
      try{ await this.client.from('settings').upsert({key,value:String(value)}); }catch(e){}
    }
  },
  async saveProfile(p){
    LS.set('patient_profile',p);
    if(this.ready){
      try{ await this.client.from('patient_profile').upsert(Object.assign({id:1},p)); }catch(e){}
    }
  }
};
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src;
    s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}

/* date helpers for schedule */
function isSunday(d=new Date()){ return d.getDay()===0; }
function nextSunday(from=new Date()){
  const d=new Date(from); d.setHours(0,0,0,0);
  const add=(7-d.getDay())%7; d.setDate(d.getDate()+(add===0?0:add)); return d;
}
function vitDNextDose(from=new Date()){
  const base=new Date(FIXED.vitd_base+'T00:00:00');
  const day=new Date(from); day.setHours(0,0,0,0);
  let due=new Date(base);
  while(due<day) due.setDate(due.getDate()+30);
  return due;
}
function daysUntil(dateObj){
  const a=new Date(); a.setHours(0,0,0,0);
  const b=new Date(dateObj); b.setHours(0,0,0,0);
  return Math.round((b-a)/86400000);
}
function fmtDate(d){ return new Date(d).toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',

        : isActive?el('span',{class:'pill amber',text:'ACTIVE'}):el('span',{class:'pill gray',text:'—'})),
    ]);

      const steps=el('div',{class:'steps'});

        const doneAt=s['step'+step.n+'_done_at'];

        const locked=!doneAt && !prevDone;
        const row=el('div',{class:'step'+(locked?' locked':'')},[
          el('span',{class:'sic',text:step.ic}),

          ]),

async function completeStep(sessIdx, step){
  if(!requireNurse()) return;
  const sessions=loadSessions();
  const s=sessions[sessIdx];
  // enforce order
  if(step.n>1 && !s['step'+(step.n-1)+'_done_at']){ toast('Complete the previous step first','err'); return; }
  if(s['step'+step.n+'_done_at']) return;
  s['step'+step.n+'_done_at']=nowStamp();
  s.nurse_name=nurse;
  saveSessions(sessions);

  // persist full session row + audit
  await DB.insert('sessions', {
    id:uid(), session_date:todayISO(), session_number:s.num, scheduled_time:s.scheduled_time,
    nurse_name:nurse,
    step1_done_at:s.step1_done_at,step2_done_at:s.step2_done_at,step3_done_at:s.step3_done_at,
    step4_done_at:s.step4_done_at,step5_done_at:s.step5_done_at,
  });
  await logAction('feeding', `Session ${s.num} · Step ${step.n}: ${step.title}`, 'done');

  toast(`${step.ic} ${step.title} — ${t('logged')}`,'ok');
  renderToday();
}
/* live countdown timers for feeding steps */
let timerInt=null;
function startTimers(){
  if(timerInt) clearInterval(timerInt);
  const tick=()=>{
    $$('.timer[data-timer]').forEach(node=>{
      const start=new Date(node.dataset.timer).getTime();
      const mins=Number(node.dataset.mins);
      const end=start+mins*60000;
      const left=end-Date.now();
      if(left<=0){ node.textContent='⏱️ Timer complete — proceed'; node.style.color='var(--green)'; return; }
      const m=Math.floor(left/60000), sec=Math.floor((left%60000)/1000);
      node.textContent=`⏱️ ${pad(m)}:${pad(sec)} remaining`;
    });
  };
  tick(); timerInt=setInterval(tick,1000);
}

function medItem(it, slotTime, done){
  const st=done[it.id]||{};
  const isDone=!!st.given_at;
  const isNGT=it.type===NGT;
  const row=el('div',{class:'item'+(isDone?' done':'')});
  const chk=el('div',{class:'chk',text:isDone?'✓':'',onClick:()=>toggleMed(it,slotTime)});
  const body=el('div',{class:'ibody'},[
    el('div',{class:'iname',text:it.ic+' '+it.name}),
    isDone? el('div',{class:'istamp',text:`✓ ${timeHM(st.given_at)} · ${st.nurse||''}`})
          : el('div',{class:'isub',text:it.type===NGT?'Give via NGT — crush first':it.type}),
  ]);
  if(isNGT){
    const sub=el('div',{class:'subchk'},[
      subBox('Crushed thoroughly', st.crushed, (c)=>updateSub(it.id,'crushed',c)),
      subBox('Flush done after', st.flush, (c)=>updateSub(it.id,'flush',c)),
    ]);
    body.appendChild(sub);
  }
  row.appendChild(chk); row.appendChild(body);
  return row;

  function subBox(label,checked,cb){
    const inp=el('input',{type:'checkbox',onChange:e=>cb(e.target.checked)});
    inp.checked=!!checked;
    return el('label',{},[inp, document.createTextNode(' '+label)]);
  }

function updateSub(itemId, key, val){

async function toggleMed(it, slotTime){
  if(!requireNurse()) return;
  const done=loadMedDone();
  const st=done[it.id]||{};
  if(st.given_at){ // undo
    delete done[it.id]; saveMedDone(done); renderMeds();
    toast('Unchecked','info'); return;
  }
  // vital: prompt for reading
  let vitalVal=null;
  if(it.vital){
    vitalVal=prompt('Enter blood glucose reading (mmol/L or mg/dL):','');
    if(vitalVal===null) return;
  }
  const isNGT=it.type===NGT;
  st.given_at=nowStamp(); st.nurse=nurse;
  if(isNGT){ st.crushed = st.crushed!==false; st.flush = st.flush!==false; } // default assumed if not toggled off
  done[it.id]=st; saveMedDone(done);

  // persist
  if(it.vital){
    await DB.insert('vitals_log',{id:uid(),log_date:todayISO(),logged_at:nowStamp(),nurse_name:nurse,
      bp:'',pulse:'',temp:'',o2_sat:'',blood_glucose:vitalVal||'',notes:it.name});
    await logAction('vital', `${it.name}: ${vitalVal}`, 'done');
  }else{
    await DB.insert('medications_log',{id:uid(),log_date:todayISO(),slot_time:slotTime,med_name:it.name,
      nurse_name:nurse, crushed_confirmed:isNGT?!!st.crushed:null, flush_done:isNGT?!!st.flush:null,
      given_at:st.given_at, skipped:false, skip_reason:''});
    await logAction('medication', `${slotTime} · ${it.name}`, 'done');
  }
  toast(`${it.ic} ${t('done')}`,'ok');
  renderMeds();
}

function missedYesterday(){
  const y=new Date(); y.setDate(y.getDate()-1);
  const yISO=todayISO(y);
  const done=loadMedDone(yISO);
  // only compute if there was any activity that day (avoid false "missed" on fresh installs)
  if(Object.keys(LS.get(medDoneKey(yISO),{})).length===0 && !LS.get('activity_'+yISO,false)) return [];
  const missed=[];
  DAILY_SCHEDULE.forEach(slot=>slot.items.forEach(it=>{
    if(!(done[it.id]&&done[it.id].given_at)) missed.push(it);
  }));
  return missed;
}

async function queryRange(){

  return rows;

/* =========================================================================
   SQL SCHEMA (shown + copyable in Admin)
   ========================================================================= */
const SQL_SCHEMA = `-- Patient Care PWA — Supabase schema
create table if not exists patient_profile (
  id bigint primary key default 1,
  name text, national_id text, hc_number text, dob date,
  gender text, address text, diagnosis_notes text
);

create table if not exists sessions (
  id text primary key,
  session_date date, session_number int, scheduled_time text, nurse_name text,
  step1_done_at timestamptz, step2_done_at timestamptz, step3_done_at timestamptz,
  step4_done_at timestamptz, step5_done_at timestamptz
);

create table if not exists medications_log (
  id text primary key,
  log_date date, slot_time text, med_name text, nurse_name text,
  crushed_confirmed bool, flush_done bool, given_at timestamptz,
  skipped bool default false, skip_reason text
);

create table if not exists suppository_log (
  id text primary key,
  given_date date, given_at timestamptz, nurse_name text, notes text
);

create table if not exists vitals_log (
  id text primary key,
  log_date date, logged_at timestamptz, nurse_name text,
  bp text, pulse text, temp text, o2_sat text, blood_glucose text, notes text
);

create table if not exists action_log (
  id text primary key,
  log_date date, logged_at timestamptz, nurse_name text,
  action_type text, action_detail text, status text
);

create table if not exists settings (
  key text primary key, value text
);

-- Enable Row Level Security + permissive public policies
alter table patient_profile enable row level security;
alter table sessions enable row level security;
alter table medications_log enable row level security;
alter table suppository_log enable row level security;
alter table vitals_log enable row level security;
alter table action_log enable row level security;
alter table settings enable row level security;

do $$
declare t text;
begin
  foreach t in array array['patient_profile','sessions','medications_log',
    'suppository_log','vitals_log','action_log','settings']
  loop
    execute format('drop policy if exists public_all on %I;', t);
    execute format('create policy public_all on %I for all using (true) with check (true);', t);
  end loop;
end $$;`;

   ========================================================================= */
let notifTimers=[];
function clearNotifTimers(){ notifTimers.forEach(id=>clearTimeout(id)); notifTimers=[]; }
function scheduleNotifications(){
  clearNotifTimers();
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now=new Date();
  const events=[];
  feedingTimes().forEach((hm,i)=>events.push({hm, title:'🍼 Feeding due', body:`Session ${i+1} at ${hm}`}));
  DAILY_SCHEDULE.forEach(slot=>{
    const names=slot.items.map(x=>x.name.split(' — ')[0]).slice(0,3).join(', ');
    events.push({hm:slot.time, title:'💊 Medication due', body:`${slot.time}: ${names}${slot.items.length>3?'…':''}`});
  });
  events.forEach(ev=>{
    const {h,m}=parseHM(ev.hm);
    [30,0].forEach(offset=>{
      const target=new Date(now); target.setHours(h,m-offset,0,0);
      if(target<=now) return; // only future today
      const delay=target-now;
      if(delay>0 && delay<24*3600000){
        const id=setTimeout(()=>fireNotification(
          offset===30?`⏰ In 30 min: ${ev.title}`:ev.title,
          ev.body), delay);
        notifTimers.push(id);
      }
    });
  });
}
function fireNotification(title, body){
  const icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230f766e'/%3E%3C/svg%3E";
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type:'notify',title,body,icon,tag:title});
  }else if('Notification' in window && Notification.permission==='granted'){
    new Notification(title,{body,icon});
  }
}
async function requestNotifPermission(){
  if(!('Notification' in window)){ toast('Notifications not supported','err'); return; }
  if(Notification.permission==='granted'){ scheduleNotifications();
    fireNotification('🔔 Notifications on','You’ll be reminded 30 min before & at each task.'); return; }
  const p=await Notification.requestPermission();
  if(p==='granted'){ toast('🔔 Notifications enabled','ok'); scheduleNotifications();
    fireNotification('🔔 Notifications on','You’ll be reminded 30 min before & at each task.'); }
  else toast('Notifications blocked','err');
}

/* =========================================================================
   MISC — nurse, lang, midnight reset, requireNurse
   ========================================================================= */
function requireNurse(){
  if(!nurse){ toast(t('needNurse'),'err'); $('#nurseName').focus(); return false; }
  LS.set('activity_'+todayISO(), true);
  return true;
}
function bindHeader(){
  const ni=$('#nurseName'); ni.value=nurse;
  ni.addEventListener('input', ()=>{ nurse=ni.value.trim(); LS.set('nurse_name',nurse); });
  $('#langBtn').addEventListener('click', ()=>{ lang=lang==='ar'?'en':'ar'; LS.set('lang',lang);
    applyI18n(); renderTab(currentTab); });
  $('#notifBtn').addEventListener('click', requestNotifPermission);
  $$('#tabs button').forEach(b=> b.addEventListener('click', ()=>show(b.dataset.tab)));
}
/* auto-reset checklist at midnight */
let lastDay=todayISO();
function midnightWatch(){
  setInterval(()=>{
    const d=todayISO();
    if(d!==lastDay){
      lastDay=d; openSession=null;
      toast('🌅 New day — checklist reset','info',3500);
      scheduleNotifications();
      renderTab(currentTab);
    }
  }, 30000);
}
function updateSyncBadge(){
  const b=$('#sbStatus'); if(b){ b.textContent=DB.ready?'Connected':'Local'; b.className='pill '+(DB.ready?'green':'amber'); }
}

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot(){
  applyI18n();
  bindHeader();
  // load settings from Supabase if profile has connection saved
  await DB.init();
  // pull settings/profile from Supabase if connected
  if(DB.ready){
    try{
      const s=await DB.select('settings');
      s.forEach(r=>{ if(r.key in settings){ settings[r.key]=r.value; LS.set(r.key,r.value); } });
      const pr=await DB.select('patient_profile');
      if(pr && pr[0]){ profile=Object.assign({},DEFAULT_PROFILE,pr[0]); LS.set('patient_profile',profile); }
    }catch(e){}
  }
  show('patient');
  midnightWatch();
  if('Notification' in window && Notification.permission==='granted') scheduleNotifications();

  // register service worker
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){ console.warn('SW reg failed',e); }
  }
  // first-open: gently ask for notifications
  if('Notification' in window && Notification.permission==='default'){
    setTimeout(()=>toast('Tap 🔔 to enable reminders','info',3500), 1500);
  }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
